name: Admin CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://ghais:ci_database_only@127.0.0.1:5432/ghais_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER ghais WITH PASSWORD 'ci_database_only'"
          sudo -u postgres createdb -O ghais ghais_test
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build -- --base=/admin/
