<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E2E6"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#0A0A0E" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="url(#bgGlow)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Stylized Raindrop / Crescent Ghais Motif -->
  <path d="M50 18 C50 18, 30 45, 30 62 C30 73 39 82 50 82 C61 82 70 73 70 62 C70 45, 50 18, 50 18 Z" 
        fill="url(#chromeGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <path d="M50 30 C50 30, 38 52, 38 64 C38 71 43 76 50 76 C46 72 45 66 45 60 C45 48 50 30 50 30 Z" 
        fill="#10B981" opacity="0.85"/>
  
  <!-- Specular highlight dot -->
  <circle cx="44" cy="50" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>
