# Render blueprint: Ghaith API + Postgres (replaces Appwrite Cloud).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo/branch.
# NOTE: the `free` Postgres plan expires after ~30 days — upgrade then
# (or change to basic-256mb here before the first deploy).
services:
  - type: web
    name: ghais-api
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: npm ci && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ghais-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false

databases:
  - name: ghais-db
    plan: free
